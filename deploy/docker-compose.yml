# Production stack for tx-client (app.texasrenters.com) on its VPS, following
# the tx-chatbot-vps / tx-maintenance-vps pattern.
#
#   host nginx :443 (TLS) -> 127.0.0.1:8080/8081 -> web -> app (php-fpm)
#                                                          \-> reverb (/app, /apps)
#   app, queue, scheduler, reverb, migrate: one image, different commands.
#   db: PostgreSQL in a container, on the internal network only. Its data is
#   the external volume txclient_pgdata -- back it up (host/backup-db.sh).
#
# Two env files, both beside this file and never committed:
#   .env         read by Compose itself for ${...} (APP_SLUG, HTTP_PORT_RANGE,
#                POSTGRES_*, VITE_*) -- see env.example
#   .env.docker  the Laravel environment, handed to the containers -- see
#                env.docker.example
#
# Deploy with bin/deploy.sh -- it rolls app and web without downtime and never
# restarts db. A plain `docker compose up -d` stops each container before
# starting its replacement.
#
# The per-service blocks repeat rather than share a YAML anchor: merge keys are
# YAML 1.1 and strict 1.2 parsers refuse them. Keep them in step.
name: ${APP_SLUG:-txclient}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-client_portal}
      POSTGRES_USER: ${POSTGRES_USER:-client_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # No published port: only the app's containers reach it. For a psql
    # shell: docker compose exec db psql -U client_portal client_portal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-TexasRenters.com}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:?VITE_REVERB_APP_KEY is required}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?VITE_REVERB_HOST is required}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    image: ${APP_SLUG:-txclient}/app:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    networks:
      - internal
    # Health check comes from the image: /up through FastCGI.

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-TexasRenters.com}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:?VITE_REVERB_APP_KEY is required}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:?VITE_REVERB_HOST is required}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    image: ${APP_SLUG:-txclient}/web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # Read-only: nginx serves uploaded files, only the app writes them.
      - storage-app:/var/www/html/storage/app:ro
      # Every build's JS/CSS, so tabs opened before a deploy keep working.
      - build-history:/var/www/html/public/build-history
    ports:
      # Loopback only; the host's nginx terminates TLS and proxies here. A
      # two-port range so bin/deploy.sh can run the old and new replica side
      # by side; the host nginx upstream lists both ports.
      - '127.0.0.1:${HTTP_PORT_RANGE:-8080-8081}:80'
    networks:
      - internal

  reverb:
    image: ${APP_SLUG:-txclient}/app:${APP_VERSION:-latest}
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env.docker
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'reverb:start' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # One-shot, run by bin/deploy.sh before the rollout. The profile keeps it out
  # of `docker compose up`, so replicas never race each other on the schema.
  migrate:
    image: ${APP_SLUG:-txclient}/app:${APP_VERSION:-latest}
    profiles: [tools]
    restart: "no"
    command: php artisan migrate --force
    env_file: .env.docker
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    networks:
      - internal

  queue:
    image: ${APP_SLUG:-txclient}/app:${APP_VERSION:-latest}
    restart: unless-stopped
    # queue:work finishes its current job on SIGTERM. The grace period must
    # exceed --timeout, or a deploy kills work mid-flight.
    stop_grace_period: 120s
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
    env_file: .env.docker
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    networks:
      - internal
    # The process check alone would stay green while the worker cannot reach
    # the database; migrate:status proves it answers.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null && php artisan migrate:status > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3

  # Pushes queued owner approvals to Propertyware and prunes old logs
  # (routes/console.php). Exactly one may run: bin/deploy.sh recreates it
  # rather than rolling it, so two never overlap.
  scheduler:
    image: ${APP_SLUG:-txclient}/app:${APP_VERSION:-latest}
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env.docker
    volumes:
      - storage-app:/var/www/html/storage/app
      - storage-logs:/var/www/html/storage/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null && php artisan migrate:status > /dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3

volumes:
  # Created by host/install.sh, so compose never owns (or removes) them.
  # pgdata and storage-app are the application's state -- back both up.
  pgdata:
    external: true
    name: ${APP_SLUG:-txclient}_pgdata
  storage-app:
    external: true
    name: ${APP_SLUG:-txclient}_storage-app
  storage-logs:
    external: true
    name: ${APP_SLUG:-txclient}_storage-logs
  # JS/CSS from past builds; see docker/keep-built-assets.sh.
  build-history:
    external: true
    name: ${APP_SLUG:-txclient}_build-history

networks:
  internal:
    driver: bridge
