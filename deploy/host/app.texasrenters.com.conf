# Host nginx vhost for tx-client. host/install.sh installs it as
# /etc/nginx/sites-available/app.texasrenters.com; then, once DNS points here:
#
#   certbot --nginx -d app.texasrenters.com --redirect
#
# certbot rewrites the installed copy to add `listen 443 ssl` and the :80
# redirect. Keep what it adds when editing later, and reload, never restart.

# Both ports of the web service's range (docker-compose.yml HTTP_PORT_RANGE).
# During bin/deploy.sh the old and new replica each hold one; outside a deploy
# only one listens, and proxy_next_upstream moves on from the dead one (a
# refused loopback connect costs microseconds). max_fails=0: never mark a port
# down -- with one live replica, a single bad response would otherwise 502 the
# whole site for fail_timeout ("no live upstreams").
upstream txclient_web {
    server 127.0.0.1:8080 max_fails=0;
    server 127.0.0.1:8081 max_fails=0;
}

map $http_upgrade $txclient_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.texasrenters.com;

    # Keep in step with client_max_body_size in docker/nginx/default.conf.
    client_max_body_size 100M;

    location / {
        proxy_pass http://txclient_web;
        proxy_next_upstream error timeout http_502;
        proxy_http_version 1.1;

        # Reverb WebSockets arrive here too (Echo connects to
        # app.texasrenters.com/app/...), so pass the upgrade through.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $txclient_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logged-in pages send large response headers (session + XSRF cookies,
        # Vite preload Link headers); the 4k/8k default 502s them.
        proxy_buffer_size 32k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;

        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }
}
